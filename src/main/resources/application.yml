spring:
  application:
    name: autoclip
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:auto_clip}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
    refresh-expiration: 604800000

server:
  port: ${PORT:${SERVER_PORT:8090}}

autoclip:
  admin:
    email: ${ADMIN_EMAIL:admin@autoclip.app}
    password: ${ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: 60
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 100
  scheduler:
    publish-cron: "0 * * * * *"
    batch-size: 20
  storage:
    bucket: ${S3_BUCKET:autoclip-assets}
    region: ${S3_REGION:us-east-1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

clipflow:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8090/api/accounts/oauth2/callback/youtube}
      frontend-redirect: ${FRONTEND_REDIRECT:https://autoflow-app-phi.vercel.app/settings/accounts}
    tiktok:
      client-key: ${TIKTOK_CLIENT_KEY:}
      client-secret: ${TIKTOK_CLIENT_SECRET:}
      redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8090/api/accounts/oauth2/callback/tiktok}
      frontend-redirect: ${FRONTEND_REDIRECT:https://autoflow-app-phi.vercel.app/settings/accounts}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
      redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:8090/api/accounts/oauth2/callback/facebook}
      scope: ${FACEBOOK_SCOPE:public_profile}
      frontend-redirect: ${FRONTEND_REDIRECT:https://autoflow-app-phi.vercel.app/settings/accounts}
